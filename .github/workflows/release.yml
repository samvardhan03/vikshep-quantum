name: Release

# Builds every release artifact; publishes only from a version tag (vX.Y.Z).
# - pull_request (release files changed) and workflow_dispatch: dry run, the
#   same builds with nothing published.
# - tag push: PyPI (trusted publishing, environment "pypi"), crates.io
#   (CARGO_REGISTRY_TOKEN secret, environment "crates-io"), then a GitHub
#   release with the wheels and checksums. Publishing waits for every build.
# Procedure and one-time setup: RELEASING.md.

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "Cargo.toml"
      - "crates/*/Cargo.toml"
      - "crates/vikshep-quantum-py/pyproject.toml"
      - "RELEASING.md"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    shell: bash

jobs:
  # On a tag, the tag must equal the workspace version.
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1 # reads rust-toolchain.toml
      - id: v
        run: |
          version="$(cargo metadata --no-deps --format-version 1 --locked \
            | jq -r '.packages[] | select(.name == "vikshep-qcore") | .version')"
          echo "workspace version: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "tag $GITHUB_REF_NAME does not match workspace version $version"; exit 1
          fi
      - name: The crates package and build from their published contents
        run: cargo package --locked -p vikshep-qcore -p vikshep-statevec

  # Five abi3 wheels (Python 3.10+), each tested with pytest where it runs
  # natively: the conformance self-test, byte equality with the vectors, the
  # API tests and the Qiskit integration.
  wheels:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64, os: ubuntu-latest, target: x86_64, manylinux: "2_28", container: "quay.io/pypa/manylinux_2_28_x86_64", test: true }
          - { name: linux-aarch64, os: ubuntu-24.04-arm, target: aarch64, manylinux: "2_28", container: "quay.io/pypa/manylinux_2_28_aarch64", test: true }
          - { name: macos-arm64, os: macos-15, target: aarch64, manylinux: "off", container: "", test: true }
          - { name: macos-x86_64, os: macos-15, target: x86_64, manylinux: "off", container: "", test: false }
          - { name: windows-x86_64, os: windows-latest, target: x64, manylinux: "off", container: "", test: true }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - name: Build the wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          container: ${{ matrix.container }}
          rust-toolchain: "1.97.0"
          working-directory: crates/vikshep-quantum-py
          args: --release --locked --out dist
      - name: Test the wheel (pytest)
        if: matrix.test
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pytest qiskit
          python -m pip install --no-index --find-links crates/vikshep-quantum-py/dist vikshep-quantum
          cd "$RUNNER_TEMP"
          python -I -m pytest -q "$GITHUB_WORKSPACE/crates/vikshep-quantum-py/tests"
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.name }}
          path: crates/vikshep-quantum-py/dist/*.whl
          if-no-files-found: error

  pypi:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [version, wheels]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # trusted publishing; no API token is stored
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true
      - run: ls -l dist
      - uses: pypa/gh-action-pypi-publish@release/v1

  crates:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [version, wheels]
    runs-on: ubuntu-latest
    environment: crates-io
    timeout-minutes: 60
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Publish the crates (dependencies first; publish = false crates are skipped)
        run: |
          if [[ -z "$CARGO_REGISTRY_TOKEN" ]]; then
            echo "::warning::CARGO_REGISTRY_TOKEN is not set; crates were not published (see RELEASING.md)"
            exit 0
          fi
          scripts/publish-crates.sh

  # Last, so its notes ("pip install ...", "cargo add ...") are true when it appears.
  github-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [version, wheels, pypi, crates]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd assets
          sha256sum * > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "vikshep-quantum $GITHUB_REF_NAME" \
            --notes "Python: pip install vikshep-quantum==${{ needs.version.outputs.version }}. Rust: cargo add vikshep-statevec@=${{ needs.version.outputs.version }}. Wheels for Linux (x86_64, AArch64), macOS (arm64, x86_64) and Windows (x86_64); checksums in SHA256SUMS. Specification: spec/VQS-1.md; conformance suite vqs1-v1 (257 cases)." \
            ./*
