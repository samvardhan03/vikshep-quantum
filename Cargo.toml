[workspace]
resolver = "3"
members = [
    "crates/vikshep-qcore",
    "crates/vikshep-statevec",
    "crates/vikshep-qconformance",
    "crates/vikshep-quantum-py",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.97.0"
license = "AGPL-3.0-or-later"
authors = ["Samvardhan Singh"]
repository = "https://github.com/samvardhan03/vikshep-quantum"
homepage = "https://github.com/samvardhan03/vikshep-quantum"
keywords = ["quantum", "simulator", "state-vector", "deterministic", "reproducibility"]
categories = ["science", "simulation"]
# New crates are not published. The crates on crates.io (vikshep-qcore and
# vikshep-statevec) drop `publish.workspace = true` from their manifest; see
# RELEASING.md.
publish = false

[workspace.dependencies]
# Exact pins: any change to these can change output bytes and therefore
# requires review under spec/VQS-1.md section 12 (versioning).
#
# The Vikshep open core supplies the arithmetic this repository builds on:
# flush-to-zero and before-rounding multiplication tininess (VDS-1 section 8),
# Philox streams (section 5), SHA3 object identifiers (section 9), canonical
# JSON, and the portable sin/cos of vikshep-detmath (section 4).
vikshep-detmath = "=0.1.0"
vikshep-numerics = "=0.1.0"
serde_json = "=1.0.151"

# Bindings: these never touch output bytes.
pyo3 = { version = "=0.29.3", default-features = false, features = ["macros"] }
numpy = "=0.29.0"

vikshep-qcore = { path = "crates/vikshep-qcore", version = "=0.2.0" }
vikshep-statevec = { path = "crates/vikshep-statevec", version = "=0.2.0" }
vikshep-qconformance = { path = "crates/vikshep-qconformance", version = "=0.2.0" }

[workspace.lints.rust]
# Every crate forbids unsafe code except vikshep-quantum-py, which exposes a
# foreign-function interface and defines its own lint table.
unsafe_code = "forbid"

[workspace.lints.clippy]
# Deliberately NOT enabled: clippy::suboptimal_flops (and the older
# clippy::manual_mul_add). Those lints suggest replacing `a * b + c` with
# `mul_add`, which changes rounding and is forbidden in Tier-1 code by
# spec/VDS-1.md section 2 (inherited by spec/VQS-1.md section 2). Keep them
# off.

[profile.release]
# Keep release arithmetic identical to debug: Rust never contracts or
# reassociates floating-point operations at any optimisation level, and no
# profile setting here may change that.
debug = 1
